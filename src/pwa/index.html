<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--NTK:CSP-->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a2858" />
    <meta name="description" content="{{subtitle}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{appName}}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>{{appName}}</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="screen">
      <header class="hero">
        <span class="orb" aria-hidden="true"></span>
        <h1>{{appName}}</h1>
        <p class="subtitle">{{subtitle}}</p>
      </header>

      <section class="card controls">
        <div class="field row-field">
          <label for="time">{{timeLabel}}</label>
          <span class="select-wrap">
            <select id="time" name="time">
              <!--NTK:SLOT_OPTIONS-->
            </select>
          </span>
        </div>

        <div class="field row-field switch-field">
          <label for="notify">{{notificationsLabel}}</label>
          <span class="switch-wrap">
            <span id="notify-state" class="switch-state">{{notificationsOff}}</span>
            <input id="notify" name="notify" type="checkbox" role="switch" aria-checked="false" aria-describedby="notify-state notify-hint" />
          </span>
          <p id="notify-hint" class="off-hint">{{notificationsOffHint}}</p>
        </div>
      </section>

      <details class="card how">
        <summary>{{howItWorksTitle}}</summary>
        <div class="how-body">
          <!--NTK:HOW_IT_WORKS-->
          <!--NTK:PRIVACY-->
        </div>
      </details>
    </main>

    <section id="install-sheet" class="sheet" role="dialog" aria-labelledby="install-heading" aria-describedby="install-steps" tabindex="-1" hidden>
      <div class="sheet-head">
        <span class="bulb" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" focusable="false">
            <path fill="currentColor" d="M12 1.75a7.25 7.25 0 0 0-4.36 13.04c.68.51 1.11 1.3 1.11 2.15v.81h6.5v-.81c0-.85.43-1.64 1.11-2.15A7.25 7.25 0 0 0 12 1.75z" />
            <rect fill="currentColor" x="8.75" y="19" width="6.5" height="1.6" rx="0.8" />
            <rect fill="currentColor" x="10" y="21.4" width="4" height="1.6" rx="0.8" />
            <path fill="none" stroke="#fff7e3" stroke-width="1.4" stroke-linecap="round" d="M9.4 8.2a3.1 3.1 0 0 1 2.4-2.3" />
          </svg>
        </span>
        <h2 id="install-heading">{{installHeading}}</h2>
      </div>
      <p id="install-steps" class="sheet-steps">{{installStepsBefore}} <span class="share"><svg class="share-glyph" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v11M8 7l4-4 4 4M8 10H6.5A2.5 2.5 0 0 0 4 12.5v6A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-6a2.5 2.5 0 0 0-2.5-2.5H16" /></svg>{{installShare}}</span>{{installStepsAfter}}</p>
      <p class="sheet-fine">{{installVersion}}</p>
      <button type="button" id="install-dismiss" class="sheet-dismiss">{{installDismiss}}</button>
    </section>

    <p id="status" class="toast" role="status" aria-live="polite"></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
