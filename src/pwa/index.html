<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--NTK:CSP-->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a2858" />
    <meta name="description" content="{{subtitle}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{appName}}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>{{appName}}</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="screen">
      <header class="hero">
        <span class="orb" aria-hidden="true"></span>
        <h1>{{appName}}</h1>
        <p class="subtitle">{{subtitle}}</p>
      </header>

      <section class="card controls">
        <div class="field row-field">
          <label for="time">{{timeLabel}}</label>
          <span class="select-wrap">
            <select id="time" name="time">
              <!--NTK:SLOT_OPTIONS-->
            </select>
          </span>
        </div>

        <div class="field row-field switch-field">
          <label for="notify">{{notificationsLabel}}</label>
          <span class="switch-wrap">
            <span id="notify-state" class="switch-state">{{notificationsOff}}</span>
            <input id="notify" name="notify" type="checkbox" role="switch" aria-checked="false" aria-describedby="notify-state" />
          </span>
        </div>
      </section>

      <details class="card how">
        <summary>{{howItWorksTitle}}</summary>
        <div class="how-body">
          <!--NTK:HOW_IT_WORKS-->
          <!--NTK:PRIVACY-->
        </div>
      </details>
    </main>

    <p id="status" class="toast" role="status" aria-live="polite"></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
