name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by commit SHA (checkout v7.0.1, setup-node v7.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:boundary
      - run: npm run validate:content
      - name: Build PWA (no backend config needed; checks the build itself)
        run: npm run build:pwa
      - name: Secrets scan over the built PWA
        run: npx vitest run tests/boundary/pwa-secrets.test.ts
      - name: Content change impact (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:data/messages.json > "$RUNNER_TEMP/base-messages.json" || rm -f "$RUNNER_TEMP/base-messages.json"
          node scripts/check-content-diff.ts "$RUNNER_TEMP/base-messages.json" data/messages.json
